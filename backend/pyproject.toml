[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "blood-test-intelligence-backend"
version = "0.1.0"
description = "FastAPI Backend and AI/OCR Intelligence Engine for Blood Test Processing"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Lead Architect", email = "architect@tezhealth.com" }
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "B", "I", "N", "UP", "PL"]
ignore = ["E501"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --durations=10"
testpaths = [
    "tests"
]
pythonpath = ["."]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
